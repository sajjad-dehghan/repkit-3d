<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="510" viewBox="0 0 1440 510" role="img" aria-labelledby="title desc">
  <title id="title">RepKit 3D — Gym and fitness icon collection</title>
  <desc id="desc">21 transparent PNG icons at 1254 by 1254 pixels. A free collection by Sajjad Dehghan.</desc>
  <defs>
    <radialGradient id="glow" cx="82%" cy="56%" r="76%">
      <stop offset="0" stop-color="#573c07"/>
      <stop offset="0.53" stop-color="#211a09"/>
      <stop offset="1" stop-color="#090a0c"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffe06a"/><stop offset="1" stop-color="#ff941f"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="510" rx="28" fill="url(#glow)"/>
  <path d="M72 72h48" stroke="#f4c923" stroke-width="5"/>
  <text x="138" y="79" font-family="Arial,Helvetica,sans-serif" font-size="20" letter-spacing="3" fill="#f4c923">GYM &amp; FITNESS ICON COLLECTION</text>
  <text x="65" y="262" font-family="Arial,Helvetica,sans-serif" font-size="164" font-weight="700" letter-spacing="-8" fill="#fff">RepKit <tspan fill="url(#accent)">3D</tspan></text>
  <text x="75" y="323" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#d0cbc0">A little more character for your next fitness project.</text>
  <path d="M74 371h1292" stroke="#ffffff" stroke-opacity=".16"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="75" y="426" fill="#fff" font-size="25" font-weight="700">21 ICONS</text>
    <text x="335" y="426" fill="#fff" font-size="25" font-weight="700">1254 × 1254</text>
    <text x="700" y="426" fill="#fff" font-size="25" font-weight="700">TRANSPARENT PNG</text>
    <text x="1365" y="425" fill="#f4c923" font-size="23" text-anchor="end">FREE TO USE ↗</text>
    <text x="75" y="465" fill="#9b978e" font-size="17">BY SAJJAD DEHGHAN</text>
  </g>
</svg>
